<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Multiplication Shooter</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Botón de pantalla completa (solo en táctiles que la admiten; lo muestra src/ui/fullscreen.ts) -->
    <button id="fullscreen-btn" type="button" aria-label="Pantalla completa" hidden>⛶</button>
    <!-- Aviso en celular vertical: el juego es horizontal (se muestra solo por CSS) -->
    <div id="rotate-notice" role="alert">
      <div class="rotate-icon">📱</div>
      <p>Gira el celular para jugar</p>
      <p class="rotate-hint">Multiplication Shooter se juega en horizontal</p>
    </div>
    <!-- User menu outside canvas -->
    <div id="user-menu" style="display: none;">
      <div class="user-menu-toggle" id="user-menu-toggle">
        <span id="user-name" class="user-name"></span>
        <span class="menu-arrow">▼</span>
      </div>
      <div class="user-menu-dropdown" id="user-menu-dropdown">
        <button id="admin-btn" class="menu-item admin-btn" style="display: none;">⚙️ Panel Admin</button>
        <button id="stats-btn" class="menu-item stats-btn">📊 Estadísticas</button>
        <button id="logout-btn" class="menu-item logout-btn">🚪 Salir</button>
      </div>
    </div>
    <!-- Avatar hidden, used only for future reference if needed -->
    <img id="user-avatar" src="" alt="Avatar" style="display: none;">
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
